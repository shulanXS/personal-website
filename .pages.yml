# Pages CMS configuration
# Docs: https://pagescms.org/docs/configuration/
#
# ---------------------------------------------------------------------------
# How this project addresses its content
# ---------------------------------------------------------------------------
#
# Every collection has its own rule for "where does this end up on the
# site", and the editor has to follow the same rule or the link it shows
# will not be the link the site serves.
#
#   * Articles (`posts`) — Astro's glob loader takes the `slug` frontmatter
#     field as the entry id when the field is present, and falls back to the
#     file name otherwise. So the URL is `/posts/<slug>`, or
#     `/posts/<file name>` for an article that has no slug. Three of the
#     articles in the repository are in that second group.
#   * Notes (`notes`) — the file name *is* the id: a UUID. A note has no
#     page of its own; it is expanded in place on the listing.
#   * Literary works (`writing`) — the URL is always the `slug` field, so
#     the slug is required and the file name only follows it.
#   * Projects (`projects`) — a plain JSON file, not a collection.
#
# Two conventions keep the editor and the build in agreement:
#
#   * The schema is strict — unknown keys are rejected. That is why the list
#     fields use `list:` (not `of:`) and the select fields use
#     `options.values` (not a bare `options:` array). The summary of a
#     collapsible list lives *inside* `list.collapsible`, not beside it.
#   * Dates are stored with a UTC offset. Astro's YAML parser turns
#     `2026-10-28T09:30:00.000Z` and `2026-10-28T09:30:00.000+08:00` into
#     a real `Date` alike, but a naive `2026-10-28T09:30` stays a string
#     and would fail the `z.date()` schema. The offset is written out
#     rather than assumed: the editor reads a wall-clock moment and writes
#     it back with the offset of the machine it was typed on, so the stored
#     instant stays the same no matter where the edit was made. The site
#     renders every timestamp in `Asia/Shanghai`.
#
# One more convention, about images:
#
#   * An image in `public/uploads` is written into the frontmatter as an
#     absolute public path (`/uploads/abc.png`). The site serves it as-is.
#   * An image in `src/assets` is written as a path relative to the content
#     file (`../../assets/covers/abc.png`). Astro resolves it, optimizes it
#     and measures it — which is what makes it usable as the cover of a
#     series. The two kinds cannot be mixed in one field: the media picker
#     only knows about the public folder, and a public path cannot be
#     optimized by Astro. So the fields that hold repository assets are
#     plain text fields, and the fields that hold uploaded images use the
#     media picker.

media:
  - name: images
    label: 图片
    input: public/uploads
    output: /uploads
    rename: random
    extensions: [png, jpg, jpeg, webp, gif, avif]
    commit:
      templates:
        create: "media(images): create {filename}"
        update: "media(images): update {filename}"
        delete: "media(images): delete {filename}"

components:
  # -------------------------------------------------------------------------
  # Shared field definitions.
  #
  # A component that describes a *single* field keeps the frontmatter flat —
  # only `type: object` components nest the keys. Defining the date format
  # once means the editor and the repository cannot drift apart.
  # -------------------------------------------------------------------------
  publishDate:
    type: date
    label: 发布日期
    required: true
    options:
      time: true
      # The offset is written out (`+08:00`), not assumed (`Z`). A literal
      # `Z` would label the local wall clock as UTC and silently shift every
      # timestamp by the difference between the two.
      format: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
    description: 填写本机时间，保存时会带上时区偏移（如 2026-10-28T09:30:00.000+08:00）。

  updateDate:
    type: date
    label: 更新日期
    required: false
    # An optional date that starts empty. Without this the editor would
    # fill it with the current moment on every open, and the file would
    # claim to have been revised the moment it was opened.
    default: ""
    options:
      time: true
      format: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
    description: 留空表示尚未修改过。

  tagList:
    type: string
    label: 标签
    list: true
    description: 回车确认一个标签。标签在所有集合之间共享。

settings:
  # Keep the keys that the schema does not describe.
  #
  # Without this, saving an entry rewrites the frontmatter from the editor
  # form alone and drops every key the form does not cover.
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content({name}): create {filename}"
      update: "content({name}): update {filename}"
      delete: "content({name}): delete {filename}"
      rename: "content({name}): rename {oldFilename} -> {newFilename}"

content:
  # ---------------------------------------------------------------------------
  # Blog — the `posts` collection.
  #
  # Only `.md` files are editable here: the extension of the collection
  # comes from the `filename` template, so the MDX files — whose bodies
  # contain JSX that the rich-text editor would destroy — stay out of reach.
  # ---------------------------------------------------------------------------
  - name: posts
    label: 技术文章
    type: collection
    path: src/content/posts
    filename:
      template: "{fields.slug}.md"
      field: create
    operations:
      # The URL is the `slug` field, not the file name. Renaming the file
      # would only let the two drift apart.
      rename: false
    exclude:
      # These articles carry raw HTML in their body — a `<figure>`, a
      # `<video>`, an HTML comment. The rich-text editor is a Markdown
      # editor: it does not know those tags, so it escapes them into
      # visible text on the first save, and the article would show a wall
      # of `‹video autoplay=“loop”›` instead of the video. They are left
      # to be edited in the repository.
      - astro-paper-2.md
      - astro-paper-3.md
      - astro-paper-4.md
      - tailwind-typography.md
      - how-to-add-latex-equations-in-blog-posts.md
      - setting-dates-via-git-hooks.md
    view:
      fields: [title, pubDatetime, tags, draft]
      primary: title
      sort: [pubDatetime, title]
      search: [title, description]
      default:
        sort: pubDatetime
        order: desc
    fields:
      - name: title
        type: string
        required: true
        label: 标题
        options:
          minlength: 2
      - name: slug
        type: string
        required: false
        label: Slug
        # The pattern also accepts the empty string.
        #
        # An optional field with a strict pattern is a trap: the editor
        # holds an empty string for a field that has no value, and the
        # validation rejects an empty string — so the form could not be
        # saved at all. Three of the articles have no slug (their link
        # comes from the file name), and they have to stay editable.
        pattern: "^$|^[a-z0-9-]+$"
        description: 决定文章链接（/posts/<slug>）。留空时链接取文件名。修改它会改变已有链接，请谨慎。新建文章时必填。
      - name: description
        type: text
        required: true
        label: 摘要
        description: 列表页与 SEO 使用的摘要。
      - name: pubDatetime
        component: publishDate
      - name: modDatetime
        component: updateDate
      - name: author
        type: string
        required: false
        label: 作者
      - name: tags
        component: tagList
      - name: featured
        type: boolean
        required: false
        default: false
        label: 首页推荐
        description: 保留字段，站点当前未按此筛选。
      - name: draft
        type: boolean
        required: false
        default: false
        label: 草稿
        description: 草稿不会出现在列表、RSS 与搜索中。
      - name: ogImage
        type: string
        required: false
        label: 分享图
        description: 图片路径。public 下的图片用绝对路径（/uploads/abc.png），仓库内的图片用相对本文的路径（../../assets/images/abc.png）。
      - name: canonicalURL
        type: string
        required: false
        label: 规范链接
        description: 转载或外链文章的原始地址。
      - name: timezone
        type: string
        required: false
        label: 时区
        description: 留空则使用站点时区（Asia/Shanghai）。
      - name: hideEditPost
        type: boolean
        required: false
        default: false
        label: 隐藏编辑链接
      - name: body
        type: rich-text
        label: 正文
        options:
          media: images

  # ---------------------------------------------------------------------------
  # Notes — short-form posts ("碎碎念").
  #
  # The `id` field is a UUID v4 and doubles as the file name, so the link
  # stays stable when the publish date changes.
  # ---------------------------------------------------------------------------
  - name: notes
    label: 碎碎念
    type: collection
    path: src/content/notes
    filename: "{fields.id}.md"
    operations:
      # The file name *is* the id; renaming it would break the entry.
      rename: false
    view:
      fields: [pubDatetime, title, tags, draft]
      # A note may have no title, so the date identifies it in the list.
      primary: pubDatetime
      sort: [pubDatetime, title]
      search: [title, content]
      default:
        sort: pubDatetime
        order: desc
    fields:
      - name: id
        type: uuid
        required: true
        label: ID
        options:
          editable: false
          # The file name is the id. A regenerated id would no longer match
          # the file, and the note would lose its anchor.
          generate: false
        description: 文件名即 ID，创建后不可更改。
      - name: title
        type: string
        required: false
        label: 标题
        description: 留空则由正文开头自动生成（仅用于搜索索引）。
      - name: content
        type: text
        required: false
        label: 内容
      - name: images
        type: image
        required: false
        label: 图片
        options:
          media: images
          multiple:
            max: 9
          unique: true
        description: 单张请控制在 3 MB 以内。手机照片请先压缩再上传（`npm run image:prepare -- <文件>`）；一次只传一张，多张同时上传会互相抢占分支而失败。
      - name: imageAlts
        type: string
        required: false
        label: 图片说明
        list: true
        description: 与「图片」按顺序一一对应的替代文本。
      - name: pubDatetime
        component: publishDate
      - name: modDatetime
        component: updateDate
      - name: tags
        component: tagList
      - name: canonicalURL
        type: string
        required: false
        label: 规范链接
      - name: draft
        type: boolean
        required: false
        default: false
        label: 草稿

  # ---------------------------------------------------------------------------
  # Writing — novels, essays, short stories.
  #
  # `series`, `chapterNumber` and `status` are reserved for chapters.
  # ---------------------------------------------------------------------------
  - name: writing
    label: 文学创作
    type: collection
    path: src/content/writing
    filename:
      template: "{fields.slug}.md"
      field: create
    operations:
      # The URL is the `slug` field, not the file name.
      rename: false
    view:
      fields: [title, type, series, chapterNumber, pubDatetime, draft]
      primary: title
      sort: [series, chapterNumber, pubDatetime]
      search: [title, description]
      default:
        sort: pubDatetime
        order: desc
    fields:
      - name: title
        type: string
        required: true
        label: 标题
      - name: slug
        type: string
        required: true
        label: Slug
        pattern: "^[a-z0-9-]+$"
        description: 决定作品链接（/writing/<slug>）。修改它会改变已有链接，请谨慎。
      - name: type
        type: select
        required: false
        default: essay
        label: 类型
        options:
          values:
            - name: novel
              label: 小说
            - name: essay
              label: 散文
            - name: short
              label: 短篇
      - name: description
        type: text
        required: false
        label: 简介
      - name: series
        type: string
        required: false
        label: 系列
        description: 同一系列的作品会共用章节导航。封面挂在系列的第一章上。
      - name: chapterNumber
        type: number
        required: false
        label: 章节序号
        options:
          min: 1
      - name: status
        type: select
        required: false
        label: 状态
        options:
          values:
            - name: ongoing
              label: 连载中
            - name: completed
              label: 已完结
      - name: cover
        type: string
        required: false
        label: 封面
        description: 仓库内的图片，填相对于本文的路径（如 ../../assets/covers/xue-luo-jiang-chuan.png）。由 npm run covers:build 生成。
      - name: pubDatetime
        component: publishDate
      - name: modDatetime
        component: updateDate
      - name: tags
        component: tagList
      - name: canonicalURL
        type: string
        required: false
        label: 规范链接
      - name: draft
        type: boolean
        required: false
        default: false
        label: 草稿
      - name: body
        type: rich-text
        label: 正文
        options:
          media: images

  # ---------------------------------------------------------------------------
  # Projects — a plain JSON file, editable with a simple form.
  # ---------------------------------------------------------------------------
  - name: projects
    label: 项目
    type: file
    path: src/data/projects.json
    format: json
    operations:
      delete: false
    fields:
      - name: projects
        type: object
        label: 项目列表
        list:
          collapsible:
            collapsed: false
            summary: "{fields.name} ({index})"
        fields:
          - name: name
            type: string
            required: true
            label: 名称
          - name: description
            type: text
            required: false
            label: 简介
          - name: techStack
            type: string
            required: false
            label: 技术栈
            list: true
          - name: tags
            component: tagList
          - name: github
            type: string
            required: false
            label: GitHub
            pattern: "^https?://.+"
          - name: demo
            type: string
            required: false
            label: 演示地址
            pattern: "^https?://.+"
          - name: screenshot
            type: image
            required: false
            label: 截图
            options:
              media: images
            description: 单张请控制在 3 MB 以内；手机截图请先压缩再上传（`npm run image:prepare -- <文件>`）。
          - name: featured
            type: boolean
            required: false
            default: false
            label: 首页推荐
            description: 保留字段，首页当前按时间排序，不读取该字段。
          - name: pubDatetime
            component: publishDate
            # A project without a date is dated to the epoch and falls to
            # the bottom of the timeline, so the date is not required.
            required: false
          - name: order
            type: number
            required: false
            label: 排序
            description: 数字越小越靠前。
