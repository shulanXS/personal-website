<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!--
      The eye patches are solid shapes, and the closed, contented eyes are
      punched out of them with a mask. Because the eyes are cut *into* the
      markings rather than drawn on top of them, they read as part of the
      face instead of as a separate pair of spectacles.
    -->
    <mask id="sloth-eyes">
      <rect width="128" height="128" fill="black" />
      <g stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none">
        <path d="M46 63.2q6-6.8 12 0" />
        <path d="M70 63.2q6-6.8 12 0" />
      </g>
    </mask>
  </defs>

  <!--
    The icon carries its own background so that it stays legible in the
    browser chrome, where the surrounding colour is out of our control and
    the artwork would otherwise be a pale line drawing on a pale tab.
  -->
  <rect width="128" height="128" rx="28" fill="#1d1f26" />

  <g
    stroke="#f5f3ef"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <!-- The branch the sloth hangs from. -->
    <path d="M18.4 20.8c30.4-6.8 60.8-6.8 91.2 0" />
    <path d="M43.6 18c0 19.2 4.4 32 9.6 41.6" />
    <path d="M84.4 18c0 19.2-4.4 32-9.6 41.6" />

    <!-- The round face. -->
    <path
      d="M64 47.6c16.4 0 28.4 11.6 28.4 25.6S80.4 98.8 64 98.8 35.6 87.2 35.6 73.2 47.6 47.6 64 47.6Z"
    />

    <!-- The slow, contented smile. -->
    <path d="M57.6 77.6q6.4 6.4 12.8 0" />
  </g>

  <!-- The dark markings around the eyes — the sloth's signature. -->
  <g fill="#f5f3ef" mask="url(#sloth-eyes)">
    <ellipse cx="52" cy="62.4" rx="10.8" ry="12.4" />
    <ellipse cx="76" cy="62.4" rx="10.8" ry="12.4" />
  </g>
</svg>
