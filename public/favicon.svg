<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    The favicon carries the same monogram as the site header, drawn in the
    dark ink of the site.

    The strokes name their colour outright, because a favicon is painted by
    the browser on whatever tab bar the reader happens to have — that
    background is outside our control. This file is the variant for a *light*
    tab bar; the dark one lives in `favicon-dark.svg`.
  -->
  <g
    stroke="#1d1f26"
    stroke-width="2.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <path d="M37.02 13.07A17 17 0 1 0 37.02 34.93" />
    <path d="M12.6 18.4 15.6 29.8 18.8 19.8 22 29.8 25 18.4" />
    <path d="M33.6 18.4v7.4c0 2.6-2.1 4-5.3 4" />
  </g>
</svg>
