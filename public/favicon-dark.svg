<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    The favicon drawn in the light ink of the site.

    This is the variant for a *dark* tab bar, where the dark version of the
    logo would disappear. It is declared in the document head with
    `media="(prefers-color-scheme: dark)"`, so the browser picks the one
    that matches the reader's system theme.
  -->
  <g
    stroke="#f5f3ef"
    stroke-width="2.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <path d="M37.02 13.07A17 17 0 1 0 37.02 34.93" />
    <path d="M12.6 18.4 15.6 29.8 18.8 19.8 22 29.8 25 18.4" />
    <path d="M33.6 18.4v7.4c0 2.6-2.1 4-5.3 4" />
  </g>
</svg>
