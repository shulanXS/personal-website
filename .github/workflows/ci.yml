name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🚀 Build the project"
        run: pnpm run build

      # The build already runs the redirect audit, but it is repeated here
      # as its own step so that a failure points at the redirects rather
      # than at the build as a whole.
      - name: "🔀 Auditing redirects against Cloudflare's routing engine"
        run: pnpm run redirects:audit

      # The generated file must never drift from its source. If someone
      # edits `public/_redirects` by hand, this step catches it.
      - name: "🔀 Checking that public/_redirects is up to date"
        run: |
          pnpm run redirects:write
          git diff --exit-code -- public/_redirects
